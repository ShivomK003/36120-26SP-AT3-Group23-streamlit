[project]
name = "group23-crypto-streamlit"
version = "0.1.0"
description = "Group 23 cryptocurrency financial intelligence frontend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit==1.59.0",
    "starlette==1.3.1",
    "uvicorn==0.50.0",
    "httpx==0.28.1",
    "numpy==2.2.6",
    "requests>=2.32,<3",
    "pandas==2.2.2",
    "plotly>=5.24,<7",
]

[project.optional-dependencies]
test = ["pytest==8.2.2"]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
]
